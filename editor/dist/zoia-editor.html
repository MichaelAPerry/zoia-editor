<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patch Editor for the ZOIA</title>
  <style>
:root {
  --paper:#e8edee; --panel:#f2f6f6; --shell:#dbe4e6; --deep:#0f2630; --mid:#375f6e;
  --rule:#c2d0d4; --amber:#995009; --cable:#255e73; --good:#23734a; --bad:#a63e30;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
:root[data-theme="dark"] {
  --paper:#0e1417; --panel:#141b1f; --shell:#1a2328; --deep:#e4e9eb; --mid:#a5bac2;
  --rule:#35434a; --amber:#ffc17b; --cable:#84cadf; --good:#6ed9a1; --bad:#ffa594;
  color-scheme:dark;
}
* { box-sizing:border-box }
body { margin:0; color:var(--deep); background:var(--paper); font: .875rem/1.45 var(--sans) }
#app { max-width:1536px; margin:auto; padding:0 clamp(.75rem,2.5vw,2.5rem) 2rem }
.site-head,.toolbar,.page-head,.dialog-head,.cluster { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap }
.site-head,.dialog-head { justify-content:space-between }
.site-head { padding:1rem 0 .75rem; border-bottom:1px solid var(--rule) }
h1 { font:400 1.8rem/1.2 var(--serif); margin:0 }
h1 small { font:600 .95rem var(--sans); color:var(--mid); letter-spacing:.04em }
h2 { margin:0 0 .65rem; color:var(--mid); font:600 .79rem var(--sans); letter-spacing:.08em; text-transform:uppercase }
h3 { margin:.1rem 0 .25rem; font:400 1.3rem var(--serif) }
p { margin:.3rem 0 }
label { color:var(--mid) }
input,select,button { font:500 .84rem var(--sans); color:var(--deep); background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:.4rem .56rem; min-width:0 }
button,select { cursor:pointer }
button:hover:not(:disabled),select:hover { border-color:var(--mid) }
button:disabled { opacity:.48; cursor:default }
button.primary { background:var(--deep); color:var(--panel); border-color:var(--deep); min-width:4rem }
button[aria-pressed="true"],button[aria-current="page"] { background:color-mix(in srgb,var(--good) 19%,var(--panel)); border-color:var(--good) }
:focus-visible { outline:2px solid var(--amber); outline-offset:2px }
[hidden] { display:none !important }
input[type=range],meter { accent-color:var(--good); padding:0 }
.toolbar { padding:.55rem 0; border-bottom:1px solid var(--rule) }
.toolbar > .cluster { margin-left:.2rem }
#slot { width:4rem }
.volume { display:inline-flex; align-items:center; gap:.4rem; margin-left:auto }
.volume input { width:6rem }
#audio-file { color:var(--mid); overflow-wrap:anywhere }
#status { padding:.4rem 0; min-height:2rem; color:var(--mid); overflow-wrap:anywhere }
#status.error,.error { color:var(--bad) }
#status.notice,.warning { color:var(--amber) }
.workspace { display:grid; grid-template-columns:minmax(10.5rem, .75fr) minmax(0, 3.4fr) minmax(13rem, 1fr); align-items:start; gap:.8rem }
.panel { background:var(--panel); border:1px solid var(--rule); border-radius:5px; padding:.85rem }
.palette input,.inspector input:not([type=range]),.inspector select { width:100% }
#palette { max-height:29rem; overflow:auto; padding:3px; margin:.55rem -3px 0 }
details { border-top:1px solid var(--rule); padding:.25rem 0 }
summary { padding:.27rem .12rem; cursor:pointer; color:var(--mid); font-weight:600 }
.palette-item { display:block; width:100%; text-align:left; margin:.2rem 0; cursor:grab }
.page-head { justify-content:space-between; margin-bottom:.75rem }
#pages { display:flex; flex-wrap:wrap; gap:.3rem }
.grid-scroll { overflow-x:auto; padding:3px }
#grid-wrap { position:relative; min-width:360px }
.grid { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); background:var(--shell); border-radius:5px }
.pad { aspect-ratio:1; width:100%; padding:5%; background:transparent; border:0; position:relative; display:block }
.pad-face { border:1px solid var(--rule); border-radius:5px; background:color-mix(in srgb,var(--panel) 56%,var(--shell)); width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.14em; overflow:hidden; padding:3%; text-align:center }
.pad:hover .pad-face { border-color:var(--mid) }
.pad.occupied .pad-face { background:color-mix(in srgb,var(--pad-color) 26%,var(--panel)); border-color:color-mix(in srgb,var(--pad-color) 69%,var(--rule)); box-shadow:inset 0 3px var(--pad-color) }
.pad.is-selected .pad-face { outline:2px solid var(--deep); outline-offset:-3px }
.pad.is-source .pad-face { outline:3px dashed var(--amber); outline-offset:-3px }
.pad.has-port .pad-face { padding-bottom:20% }
.pad strong,.pad span.block-label { font-size:clamp(.56rem,.92vw,.74rem); overflow-wrap:anywhere; line-height:1.12 }
.pad .block-label { font-family:var(--mono) }
#grid .pad { border-radius:8px }
#grid .occupied .pad-face { border-radius:inherit; box-shadow:none }
#grid .join-left { padding-left:0 }
#grid .join-right { padding-right:0 }
#grid .join-up { padding-top:0 }
#grid .join-down { padding-bottom:0 }
#grid .join-left .pad-face { border-left:0 }
#grid .join-right .pad-face { border-right:0 }
#grid .join-up .pad-face { border-top:0 }
#grid .join-down .pad-face { border-bottom:0 }
#grid .pad.join-left { border-top-left-radius:0; border-bottom-left-radius:0 }
#grid .pad.join-right { border-top-right-radius:0; border-bottom-right-radius:0 }
#grid .pad.join-up { border-top-left-radius:0; border-top-right-radius:0 }
#grid .pad.join-down { border-bottom-left-radius:0; border-bottom-right-radius:0 }
#grid .pad strong { position:absolute; top:12%; left:5%; width:calc(var(--title-pads) * 100% - 10%); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:2; pointer-events:none; line-height:1; text-align:left }
#grid .is-selected .pad-face { outline:0; background:color-mix(in srgb,var(--pad-color) 38%,var(--panel)) }
#grid .is-source .pad-face { outline:3px dashed var(--amber) }
#grid .is-target .pad-face { outline:2px solid var(--good); outline-offset:-3px }
#grid .ghost-fit .pad-face { background:color-mix(in srgb,#31c77a 48%,var(--panel)); outline:2px solid #208450; outline-offset:-2px }
#grid .ghost-blocked .pad-face { background:color-mix(in srgb,#ff6464 48%,var(--panel)); outline:2px solid #b22828; outline-offset:-2px }
.port-out { color:#86420a }
.port-in { color:#006450 }
.pad .port { position:absolute; top:78%; transform:translate(-50%,-50%); font:700 .8rem var(--sans); z-index:2 }
.pad .port-out { left:70% }
.pad .port-in { left:30% }
.port-legend,.jack-list { display:flex; flex-wrap:wrap; gap:.35rem .8rem; font-size:.78rem; margin-top:.45rem }
.hardware-target { border-color:var(--good); box-shadow:inset 0 0 0 1px var(--good) }
.jack-list:empty { display:none }
.value-details { border:0; padding:0; font-size:.73rem }
#wires { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; pointer-events:none; z-index:1 }
.wire-line { fill:none; stroke:var(--cable); stroke-width:2; vector-effect:non-scaling-stroke; opacity:.78; pointer-events:none }
.dense .wire-line { stroke-width:1; opacity:.34 }
.wire-hit { fill:none; stroke:transparent; stroke-width:10; vector-effect:non-scaling-stroke; pointer-events:stroke; cursor:pointer }
.wire:hover .wire-line,.wire:focus-visible .wire-line,.wire.selected .wire-line,.wire.related .wire-line { stroke:var(--amber); stroke-width:3; opacity:1 }
.wire.off-page .wire-line { stroke-dasharray:4 3 }
#stubs { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.4rem }
.hint,.meta,small,#cpu { color:var(--mid) }
.hint { margin:.55rem 0 0 }
.inspector { max-height:39rem; overflow:auto }
.field { display:grid; gap:.22rem; margin:.65rem 0 }
.param { margin:.5rem 0; padding:.6rem 0; border-top:1px solid var(--rule) }
.param-head { display:flex; justify-content:space-between; align-items:center; gap:.4rem }
.param input[type=range] { width:100%; margin:.45rem 0 }
.param-value { display:grid; grid-template-columns:1fr auto; align-items:center; gap:.4rem }
.swatch { display:inline-block; width:.9rem; height:.9rem; border-radius:3px; border:1px solid var(--rule) }
.console { display:grid; grid-template-columns:1fr 1.35fr; gap:1rem; margin-top:.8rem }
#buttons { margin-top:.35rem }
.meter { display:grid; grid-template-columns:auto minmax(2rem,1fr) 8ch; gap:.45rem; align-items:center; font-family:var(--mono) }
.meter meter { width:100% }
#cpu { font-family:var(--mono); margin-top:.3rem }
#validation { list-style:none; margin:0; padding:0; max-height:9rem; overflow:auto }
#validation li + li { margin-top:.25rem }
#validation button { text-align:left }
dialog { width:min(58rem,95vw); max-height:90vh; color:var(--deep); background:var(--paper); border:1px solid var(--rule); border-radius:6px }
dialog::backdrop { background:#0f26308c }
.dialog-head h2 { margin:0 }
#corpus-search { width:100%; margin:.65rem 0 .25rem }
.corpus-scroll { max-height:62vh; overflow:auto }
table { width:100%; border-collapse:collapse; background:var(--panel) }
th,td { text-align:left; border-bottom:1px solid var(--rule); padding:.35rem .5rem }
th { position:sticky; top:0; background:var(--shell) }
td button { text-align:left }
#print-sheet { display:none }
@media (max-width:1000px) {
  .workspace { grid-template-columns:minmax(0,1fr) }
  #palette { max-height:13rem }
  .pedal-wrap { order:-1 }
  .inspector { max-height:none }
}
@media (max-width:660px) {
  .workspace,.console { grid-template-columns:minmax(0,1fr) }
  #palette { max-height:12rem }
  .pedal { padding:.8rem .6rem 1rem; border-radius:14px }
  .pedal-top { grid-template-columns:minmax(0,1fr) auto }
  .keys { grid-column:1 / -1; grid-row:2 }
  .volume { margin-left:0 }
  .pad strong,.pad span.block-label { font-size:.61rem }
}

/* ---- Pedal enclosure. It stays black in both themes; the page around it follows the theme. ---- */
.legal { margin:1rem 0 0; font-size:.74rem; color:var(--mid) }
.pedal-wrap { min-width:0 }
.pedal {
  --panel:#17171a; --shell:#040405; --deep:#e8ebee; --mid:#a2a9b0; --rule:#34363b;
  --amber:#ffc680; --cable:#8fd3ff; --good:#52e08a; --bad:#ff9080;
  position:relative; color:var(--deep); color-scheme:dark;
  padding:1.3rem 1.4rem 1.2rem; border-radius:20px; border:1px solid #000;
  background:linear-gradient(155deg,#222225 0%,#101012 38%,#070708 100%);
  box-shadow:inset 0 1px 0 #4a4b50, inset 0 0 0 3px #0a0a0b, inset 0 0 0 4px #26272a,
    0 1px 0 #fff3, 0 18px 40px #0009;
}
.screw { position:absolute; width:11px; height:11px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7b7d82,#2a2b2e 60%,#111);
  box-shadow:0 1px 1px #000a, inset 0 0 0 1px #0007 }
.screw::after { content:""; position:absolute; left:2px; right:2px; top:50%; height:1.5px; background:#0b0b0c; transform:translateY(-50%) rotate(35deg) }
.screw.tl { top:9px; left:9px } .screw.tr { top:9px; right:9px }
.screw.bl { bottom:9px; left:9px } .screw.br { bottom:9px; right:9px }
.pedal button, .pedal input, .pedal select { background:#1d1e21; border-color:#383a40; color:var(--deep) }
.pedal button:hover:not(:disabled) { border-color:#7d848c }
.pedal button[aria-pressed="true"], .pedal button[aria-current="page"] { background:color-mix(in srgb,var(--good) 24%,#17171a); border-color:var(--good) }
.pedal-top { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; gap:.7rem 1.2rem; align-items:center; margin-bottom:.9rem }
.oled-bezel { grid-column:1; grid-row:1; padding:7px; border-radius:10px; background:#000;
  box-shadow:0 0 0 2px #2b2c30, 0 0 0 3px #000, inset 0 2px 6px #000 }
.oled { position:relative; height:8.3rem; padding:.45rem .6rem; overflow:hidden; border-radius:4px;
  background:#02050b; color:#d8ecff; font:700 .82rem/1.25 var(--mono); letter-spacing:.07em; text-transform:uppercase;
  text-shadow:0 0 4px #7fb6ff99; display:flex; flex-direction:column; gap:.18rem }
/* Dot-matrix look: a fine dark mesh over the text, like unlit OLED pixels. */
.oled::after { content:""; position:absolute; inset:0; pointer-events:none;
  background-image:linear-gradient(#0007 1px,transparent 1px),linear-gradient(90deg,#0007 1px,transparent 1px);
  background-size:2px 2px; mix-blend-mode:multiply }
.oled-row { display:flex; justify-content:space-between; gap:.6rem; white-space:nowrap; overflow:hidden }
.oled-row.small { font-size:.78rem }
.oled-row.big { font-size:1.55rem; line-height:1.15; justify-content:flex-start; letter-spacing:.1em }
.oled-row.dim { opacity:.6 }
.oled-bar { position:relative; height:1.15rem; margin-top:auto; border-bottom:2px solid #d8ecff; opacity:.95 }
.oled-bar .mark { position:absolute; bottom:0; width:3px; height:100%; margin-left:-1px; background:#d8ecff }
.oled-bar .bias { position:absolute; bottom:-5px; width:9px; height:9px; margin-left:-3px; border-radius:50%; border:2px solid #d8ecff; background:#02050b; z-index:1 }
.keys { grid-column:1; grid-row:2; display:flex; flex-wrap:wrap; gap:.35rem }
.key { min-width:2.6rem; padding:.28rem .5rem; font:700 .62rem var(--sans); letter-spacing:.1em; border-radius:3px;
  background:linear-gradient(#2a2b2f,#161719) !important; border-color:#3d4046 !important; box-shadow:0 2px 0 #000 }
.key:active { transform:translateY(1px); box-shadow:0 1px 0 #000 }
.knob-area { grid-column:2; grid-row:1 / span 2; display:grid; justify-items:center; gap:.35rem }
.plate { font:700 .6rem var(--sans); letter-spacing:.2em; color:#80868d }
.knob { --angle:-135deg; position:relative; width:5.6rem; height:5.6rem; border-radius:50%; cursor:ns-resize; touch-action:none;
  background:conic-gradient(from 20deg,#3a3b3f,#17171a 18%,#44454a 35%,#151517 55%,#3c3d41 75%,#17171a);
  border:2px solid #050505;
  box-shadow:0 0 0 5px #0d0d0f, 0 0 0 6px #2f3135, 0 8px 14px #000a, inset 0 2px 3px #fff2 }
.knob::before { content:""; position:absolute; inset:14%; border-radius:50%; background:radial-gradient(circle at 40% 30%,#2b2c30,#0b0b0c); box-shadow:inset 0 0 0 1px #000, 0 1px 0 #ffffff1c }
.knob-mark { position:absolute; inset:0; transform:rotate(var(--angle)); transition:transform .05s linear }
.knob-mark::after { content:""; position:absolute; left:calc(50% - 2px); top:9%; width:4px; height:20%; border-radius:2px; background:var(--amber); box-shadow:0 0 6px var(--amber) }
.knob.idle { cursor:default } .knob.idle .knob-mark::after { background:#4a4d52; box-shadow:none }
.editor { min-width:0 }
.pedal .page-head { margin-bottom:.55rem }
.pedal #pages button { font:700 .7rem var(--sans); padding:.25rem .55rem }
.pedal .grid-scroll { padding:8px; background:#020203; border-radius:10px; box-shadow:inset 0 2px 8px #000, 0 0 0 1px #2a2b2f, 0 1px 0 #fff2 }
.pedal .grid { background:transparent }
#grid .pad { background:transparent; border-radius:0; padding:4% }
#grid .pad .pad-face { border-radius:7px; background:linear-gradient(#232428,#17181b); border:1px solid #2c2e33;
  box-shadow:inset 0 1px 0 #ffffff12, 0 2px 0 #000; color:#c9ced3 }
#grid .pad:not(.occupied):hover .pad-face { border-color:#5b6068; background:linear-gradient(#2b2c31,#1b1c1f) }
#grid .occupied .pad-face { background:var(--pad-bg); color:var(--pad-ink); border-color:color-mix(in srgb,var(--pad-color) 70%,#000);
  box-shadow:inset 0 1px 0 #ffffff55, inset 0 0 14px #0004, 0 0 10px color-mix(in srgb,var(--pad-color) 45%,transparent), 0 2px 0 #000 }
#grid .occupied.is-lit .pad-face { box-shadow:inset 0 1px 0 #fff9, 0 0 18px var(--pad-color), 0 0 0 2px #fff, 0 2px 0 #000 }
#grid .is-selected .pad-face { outline:0; background:var(--pad-bg) }
#grid .join-left,#grid .join-right,#grid .join-up,#grid .join-down { padding:4% }
#grid .join-left .pad-face,#grid .join-right .pad-face,#grid .join-up .pad-face,#grid .join-down .pad-face { border:1px solid color-mix(in srgb,var(--pad-color) 70%,#000) }
#grid .pad.join-left,#grid .pad.join-right,#grid .pad.join-up,#grid .pad.join-down { border-radius:0 }
#grid .pad strong { text-shadow:none; font-weight:800; top:13%; left:9% }
#grid .pad .port-out { color:inherit } #grid .pad .port-in { color:inherit }
#grid .pad .port { text-shadow:none }
#grid .is-source .pad-face { outline:3px dashed var(--amber); outline-offset:1px }
#grid .is-target .pad-face { outline:2px solid var(--good); outline-offset:1px }
.pedal .port-out { color:#ffb86b } .pedal .port-in { color:#6be3c1 }
.pedal .hint { color:#8d949b }
.pedal-bottom { display:grid; grid-template-columns:auto 1fr; gap:.7rem 1.2rem; align-items:center; margin-top:1rem }
.leds { display:flex; gap:.4rem; grid-column:1 / -1; justify-content:center }
.leds i { width:2.2rem; height:.45rem; border-radius:2px; background:#ff3b30; box-shadow:0 0 8px #ff3b30aa }
.leds.engaged i { background:#2dff7a; box-shadow:0 0 8px #2dff7aaa }
.stomp-row { grid-column:1 / -1; display:flex; justify-content:center }
#stomps { gap:clamp(1.2rem,6vw,3.6rem); justify-content:center; flex-wrap:nowrap; padding-bottom:1.1rem }
.stomp { position:relative; width:4.1rem; height:4.1rem; padding:0; border-radius:50% !important; cursor:pointer;
  background:radial-gradient(circle at 38% 30%,#e9ebee,#8a8e94 40%,#43464b 78%,#25272a) !important;
  border:2px solid #0b0b0c !important; box-shadow:0 0 0 4px #0e0e10, 0 0 0 5px #35373b, 0 7px 10px #000b, inset 0 -3px 5px #0007 }
.stomp::after { content:attr(data-label); position:absolute; left:50%; top:calc(100% + 11px); transform:translateX(-50%);
  font:700 .6rem var(--sans); letter-spacing:.18em; color:#8a9097; white-space:nowrap }
.stomp[aria-pressed="true"] { transform:translateY(2px); box-shadow:0 0 0 4px #0e0e10, 0 0 0 5px var(--good), 0 2px 4px #000b, inset 0 -3px 5px #0007 }
.stomp:disabled { opacity:.55 }
#buttons { grid-column:1 / -1; justify-content:center }
#buttons button { font-size:.72rem }
.pedal ::selection { background:#335 }
@media (max-width:660px) {
  .oled { height:7.4rem }
  .knob { width:4.6rem; height:4.6rem }
  .stomp { width:3.4rem; height:3.4rem }
}
@page { size:landscape; margin:12mm }
@media print {
  #app,dialog { display:none !important }
  :root { color-scheme:light }
  body { background:#fff; color:#000; font:10pt var(--sans) }
  #print-sheet { display:block }
  .sheet + .sheet { break-before:page }
  .sheet h1 { font-size:18pt; margin-bottom:8pt }
  .sheet h2 { color:#000; margin-top:8pt }
  .sheet table { background:#fff }
  .sheet .grid { width:5.8in; max-width:100%; background:none; break-inside:avoid }
  .sheet .pad { padding:2px }
  .sheet .pad-face,.sheet .pad.occupied .pad-face { background:none; border:1px solid #aaa; box-shadow:none; color:#000 }
  .sheet .pad.occupied .pad-face { border-color:#000 }
  .sheet .pad strong,.sheet .block-label { font-size:6.2pt }
  .sheet ul { margin:.25rem 0; padding-left:1.2rem }
  .sheet li { break-inside:avoid }
}
</style>

<body>
<div id="app">
  <header class="site-head">
    <h1>Patch Editor <small>for the ZOIA</small></h1>
    <label>Appearance <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </header>
  <div class="toolbar" aria-label="Patch tools">
    <label>Patch <input id="patch-name" type="text" maxlength="16" size="16" spellcheck="false"></label>
    <button id="new">New</button>
    <button id="open-bin">Open .bin</button>
    <button id="browse">Browse corpus</button>
    <div class="cluster">
      <label>Slot <input id="slot" type="number" min="0" max="999" value="0" required></label>
      <button id="save-bin">Save .bin</button>
    </div>
    <div class="cluster"><button id="open-text">Open text</button><button id="save-text">Save text</button></div>
    <div class="cluster"><button id="undo" title="Ctrl+Z">Undo</button><button id="redo" title="Ctrl+Y">Redo</button></div>
    <button id="print">Print</button>
  </div>
  <div class="toolbar" aria-label="Simulator tools">
    <button id="play" class="primary">Play</button>
    <button id="stop" disabled>Stop</button>
    <label>Input <select id="source">
      <option value="pluck">Pluck sequence</option><option value="drums">Drum loop</option>
      <option value="click">Click every 2 s</option><option value="noise">White noise burst</option>
      <option value="file">Audio file</option><option value="live">Live input · mono</option>
    </select></label>
    <button id="open-audio">Open audio</button>
    <span id="audio-file"></span>
    <label class="volume">Output volume <input id="volume" type="range" min="0" max="1" value=".65" step=".01"></label>
    <button id="record" disabled>Record 10 s to WAV</button>
  </div>
  <input id="bin-file" type="file" accept=".bin" hidden>
  <input id="text-file" type="file" accept=".txt,.yaml,.yml,text/plain" hidden>
  <input id="sound-file" type="file" accept="audio/*,.flac,.ogg,.wav,.mp3,.m4a,.aiff" hidden>
  <div id="status" role="status"></div>
  <main class="workspace">
    <aside class="panel palette">
      <h2>Modules</h2>
      <input id="module-search" type="search" placeholder="Find a module…" aria-label="Find a module">
      <div id="palette"></div>
    </aside>

async function readEmbeddedAsset(path) {
  if (!Object.hasOwn(embeddedAssets, path)) throw new Error(`Missing embedded asset: ${path}`);
  const bytes = Uint8Array.from(atob(embeddedAssets[path]), char => char.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Response(stream);
}

async function loadEmbeddedWorklet(context) {
  // A file:// page has an opaque origin, so a blob:null worklet URL is refused as cross-origin.
  // data: URLs are same-origin for module fetches, so try that first and keep blob: as a fallback.
  const utf8 = new TextEncoder().encode(embeddedWorklet);
  let binary = '';
  for (let i = 0; i < utf8.length; i += 0x8000) binary += String.fromCharCode(...utf8.subarray(i, i + 0x8000));
  try {
    await context.audioWorklet.addModule('data:text/javascript;base64,' + btoa(binary));
    return;
  } catch (error) {
    console.warn('data: worklet failed, trying blob:', error);
  }
  const url = URL.createObjectURL(new Blob([embeddedWorklet], { type: 'text/javascript' }));
  try {
    await context.audioWorklet.addModule(url);
  } finally {
    URL.revokeObjectURL(url);
  }
}

      pad.classList.toggle('join-right', slot + 1 < span && position % GRID_COLUMNS !== GRID_COLUMNS - 1)

      pad.classList.toggle('join-down', slot + GRID_COLUMNS < span)
      pad.classList.toggle('has-port', blocks.length > 0)
      pad.classList.toggle('is-target', Boolean(armed && blocks.some(block => block.signal.endsWith('_in'))))
      pad.classList.add('occupied')
      pad.classList.toggle('is-selected', selection?.kind === 'module' && selection.index === index)
      pad.classList.toggle('is-source', armed?.[0] === index && blocks.some(block => block.index === armed[1]))
      const hex = colors[moduleColor(patch, index) - 1]?.[1] ?? '#75858a'
      const chosen = selection?.kind === 'module' && selection.index === index
      const lit = chosen && knob?.block && blocks.some(block => block.name === knob.block.name)
      const light = padLight(hex, lit ? 1 : chosen ? .8 : .55)
      pad.classList.toggle('is-lit', Boolean(lit))
      pad.style.setProperty('--pad-color', hex)
      pad.style.setProperty('--pad-bg', light.background)
      pad.style.setProperty('--pad-ink', light.ink)
      const jacks = blocks.map(block => `${label(block.name)} (${block.signal.endsWith('_out') ? 'output' : 'input'})`)
      const description = `${moduleName(record)} · ${jacks.join(', ') || 'Unknown block'}`
      pad.setAttribute('aria-label', description)
      pad.title = description
      pad.draggable = true
      pad.ondragstart = event => startDrag(event, { index, slot })
      pad.ondragend = () => { drag = null }
    } else {
      pad.setAttribute('aria-label', `Empty pad ${position + 1}`)
    }
    pad.append(padFace(cell, true))
    return pad
  })
  $('grid').replaceChildren(...pads)
  const hardware = patch.modules?.flatMap((record, index) => {
    if ((record.page ?? 0) !== page || !fixedHardwarePad(record)) return []
    const block = moduleBlocks(record)[0]
    const out = block?.signal.endsWith('_out')
    const pad = button(`${out ? '◆' : '●'} ${moduleName(record)}`, () => activateJack(index, block),
      out ? 'port-out' : 'port-in')
    if (armed && !out) pad.classList.add('hardware-target')
    return [pad]
  }) ?? []
  $('hardware-pads').replaceChildren(...hardware)
}

function showInspector() {
  renderOled()
  const index = selection?.index
  renderInspector(patch, selection, {
    name: name => edit(() => model.renameModule(index, name), { regraph: false }),
    color: color => edit(() => model.setModuleColor(index, color), { regraph: false }),
    option: (name, value) => edit(() => {
      const changes = model.setOption(index, name, value)
      armed = null
      return changes
    }),
    strength: strength => edit(() => model.setConnectionStrength(index, strength)),
    notice: message => status(message, 'notice'),
    jack: block => activateJack(index, block),
    span: selection?.kind === 'module' ? gridFootprint(patch, patch.modules[index]) : 0,
    remove: removeSelection,
    star: (block, starred) => edit(() => {
      if (starred) model.unstarParam(index, block)
      else model.starParam(index, block)
    }, { regraph: false }),
    preview: (block, raw) => simulator.send('setParam', { module: index, block, raw }),
    param: (block, value, inUnits) => {
      const raw = edit(() => inUnits ? model.setParamDisplay(index, block, value)
        : model.setParam(index, block, value), { regraph: false, full: false })
      if (raw !== undefined) simulator.send('setParam', { module: index, block, raw })
      return raw
    },
  })
}

function renderValidation() {
  const issues = [...model.validate(), ...engineIssues]
  const items = issues.map(issue => {
    const li = el('li', null, issue.severity)
    const message = `${issue.severity === 'error' ? 'Error' : 'Warning'} · ${issue.message}`
    const cable = patch.connections?.[issue.connection]
    const record = patch.modules?.[issue.module]
    if (record || cable) {
      li.append(button(message, () => {
        page = record?.page ?? (cable ? endpoint(patch, cable.source).page : 0)
        renderPages()
        select(record ? 'module' : 'cable', record ? issue.module : issue.connection)
      }, issue.severity))
    } else li.textContent = message
    return li
  })
  $('validation').replaceChildren(...(items.length ? items : [el('li', 'No validation issues.', 'meta')]))
}

function renderPerformance() {
  const entries = (patch.modules ?? []).map((record, index) => ({ index, record }))
  function control(text, modules, title) {
    const node = button(text)
    node.title = title
    node.disabled = !modules.length
    let held = false
    const isLatching = record => record.type_id !== 56 && record.options?.[record.type_id === 44 ? 1 : 0] === 1
    const resting = record => record.type_id !== 56 && record.options?.[record.type_id === 44 ? 2 : 1] === 1
    const current = (index, record) => buttonStates.get(index) ??
      (isLatching(record) && record.saved_data_hex ? parseInt(record.saved_data_hex.slice(0, 2), 16) !== 0 : resting(record))
    function update(down) {
      if (held === down) return
      held = down
      for (const { index, record } of modules) {
        if (!down && isLatching(record)) continue
        const state = isLatching(record) ? !current(index, record) : resting(record) !== down
        buttonStates.set(index, state)
        simulator.send('setState', { module: index, state })
      }
      showState()
    }
    function showState() {
      node.setAttribute('aria-pressed', modules.some(({ index, record }) => current(index, record) !== resting(record)))
    }
    showState()
    node.onpointerdown = event => {
      if (event.button !== 0) return
      node.setPointerCapture(event.pointerId)
      update(true)
    }
    node.onlostpointercapture = node.onpointerup = node.onpointercancel = () => update(false)
    node.onkeydown = event => {
      if (![' ', 'Enter'].includes(event.key)) return
      event.preventDefault()
      update(true)
    }
    node.onkeyup = event => { if ([' ', 'Enter'].includes(event.key)) update(false) }
    node.onblur = () => update(false)
    node.onclick = event => {
      if (event.detail === 0) { update(true); update(false) }
    }
    return node
  }
  $('stomps').replaceChildren(...['Left', 'Middle', 'Right'].map((side, number) => {
    const matches = entries.filter(({ record }) => record.type_id === 44 && (record.options?.[0] ?? 0) === number)
    const switchName = ['SELECT', 'SCROLL', 'BYPASS'][number]
    const stomp = control('', matches, matches.length ? `${switchName} (${side}) · ${matches.map(({ record }) => moduleName(record)).join(', ')}`
      : `${switchName} (${side}): no Stompswitch module assigned`)
    stomp.className = 'stomp'
    stomp.dataset.label = switchName
    stomp.setAttribute('aria-label', `${switchName} stompswitch (${side.toLowerCase()})`)
    return stomp
  }))
  const buttons = entries.filter(({ record }) => [15, 56, 97, 98].includes(record.type_id) ||
    (record.type_id === 44 && record.options?.[0] === 3))
  $('buttons').replaceChildren(...buttons.map(entry =>
    control(moduleName(entry.record), [entry], pageName(patch, entry.record.page ?? 0))))
  if (!buttons.length) $('buttons').append(el('small', 'No pushbuttons on this patch.'))
}

function selectedKnob() {
  if (selection?.kind !== 'module') return null
  const record = patch.modules?.[selection.index]
  if (!record) return null
  const blocks = moduleBlocks(record)
  const named = activeBlock?.module === selection.index && blocks.find(block => block.name === activeBlock.name)
  const block = named || blocks.find(candidate => candidate.parameterIndex >= 0) || blocks[0]
  if (!block) return null
  const adjustable = block.parameterIndex >= 0
  const pending = knobPending?.module === selection.index && knobPending.block === block.name ? knobPending.raw : null
  return { index: selection.index, record, block, adjustable, raw: adjustable ? pending ?? knobRaw(record, block) : 0 }
}

function renderOled() {
  const knob = selectedKnob()
  const cable = selection?.kind === 'cable' ? patch.connections?.[selection.index] : null
  let cableInfo = null
  if (cable) {
    const from = endpoint(patch, cable.source)
    const to = endpoint(patch, cable.destination)
    const audio = from.block?.signal === 'audio_out' && to.block?.signal === 'audio_in'
    cableInfo = {
      from: `${from.name} ${from.block ? label(from.block.name) : ''}`,
      to: `${to.name} ${to.block ? label(to.block.name) : ''}`,
      strength: audio ? `${display(cableDb(cable, from, to))} dB` : `${display(cable.strength / 100)} %`,
    }
  }
  let selected = null
  if (knob) {
    const units = knob.block.units && knob.block.units !== 'normalized' ? ` ${knob.block.units}` : ''
    selected = {
      module: moduleName(knob.record), label: label(knob.block.name),
      value: knob.adjustable ? `${display(knob.block.display(knob.raw))}${units}` : label(knob.block.signal),
      position: knob.adjustable ? knob.raw / 65535 : null,
    }
  }
  const pages = pageIndices()
  const armedText = armed ? endpoint(patch, armed).name : null
  paintOled($('oled'), oledModel({
    patch, slot: Number($('slot').value), page: Math.max(0, pages.indexOf(page)), pageCount: pages.length,
    pageLabel: pageName(patch, page), selected, cable: cableInfo, armed: armedText, cpu: cpuText,
  }))
  const knobNode = $('knob')
  const adjustable = Boolean(knob?.adjustable)
  knobNode.classList.toggle('idle', !adjustable)
  knobNode.style.setProperty('--angle', `${-135 + 270 * (adjustable ? knob.raw / 65535 : 0)}deg`)
  knobNode.setAttribute('aria-valuenow', adjustable ? knob.raw : 0)
  knobNode.setAttribute('aria-label', adjustable ? `Knob: ${label(knob.block.name)}` : 'Knob (select a knob button)')
  knobNode.setAttribute('aria-disabled', !adjustable)
}

function knobTurn(delta, fine) {
  const knob = selectedKnob()
  if (!knob?.adjustable) return
  const raw = Math.max(0, Math.min(65535, Math.round(knob.raw + delta * (fine ? .1 : 1))))
  if (raw === knob.raw) return
  knobPending = { module: knob.index, block: knob.block.name, raw }
  simulator.send('setParam', { module: knob.index, block: knob.block.name, raw })
  renderOled()
  clearTimeout(knobTimer)
  knobTimer = setTimeout(commitKnob, 350)
}

function commitKnob() {
  clearTimeout(knobTimer)
  const pending = knobPending
  knobPending = null
  if (!pending) return
  const raw = edit(() => model.setParam(pending.module, pending.block, pending.raw), { regraph: false, full: false })
  if (raw !== undefined) simulator.send('setParam', { module: pending.module, block: pending.block, raw })
  showInspector()
  renderGrid()
}

function gotoPage(step) {
  const indices = pageIndices()
  const next = indices[Math.max(0, Math.min(indices.length - 1, indices.indexOf(page) + step))]
  if (next === page) return
  commitKnob()
  page = next
  renderPages()
  renderGrid()
  renderOled()
}

function goBack() {
  commitKnob()
  if (armed || placement) armed = placement = null
  else selection = null
  renderGrid()
  showInspector()
}

function starSelected() {
  const knob = selectedKnob()
  if (!knob?.adjustable) return
  commitKnob()
  const starred = patch.starred?.some(star => star.module === knob.index && star.block === knob.block.index)
  edit(() => starred ? model.unstarParam(knob.index, knob.block.name) : model.starParam(knob.index, knob.block.name),
    { regraph: false })
}

function initPedal() {
  const keys = [
    ['◀', 'Page left', () => gotoPage(-1), 'page-left'],
    ['▶', 'Page right', () => gotoPage(1), 'page-right'],
    ['STAR', 'Star the selected knob', starSelected, 'star'],
    ['DELETE', 'Delete the selected module or cable', removeSelection, 'delete'],
    ['UNDO', 'Undo (Ctrl+Z)', () => history('undo'), 'undo'],
    ['BACK', 'Back out of the selection (Esc)', goBack, 'back'],
  ]
  $('keys').replaceChildren(...keys.map(([text, title, action, id]) => {
    const key = button(text, action, 'key')
    key.title = title
    key.id = `key-${id}`
    key.setAttribute('aria-label', title)
    return key
  }))
  const knobNode = $('knob')
  knobNode.addEventListener('wheel', event => {
    event.preventDefault()
    knobTurn(-event.deltaY * 6.55, event.shiftKey)
  }, { passive: false })
  let pointer = null
  knobNode.onpointerdown = event => {
    if (event.button !== 0) return
    knobNode.setPointerCapture(event.pointerId)
    pointer = { id: event.pointerId, y: event.clientY }
    knobNode.focus()
    event.preventDefault()
  }
  knobNode.onpointermove = event => {
    if (pointer?.id !== event.pointerId) return
    knobTurn((pointer.y - event.clientY) * 328, event.shiftKey)
    pointer.y = event.clientY
  }
  knobNode.onpointerup = knobNode.onpointercancel = event => {
    if (pointer?.id !== event.pointerId) return
    pointer = null
    commitKnob()
  }
  knobNode.onkeydown = event => {
    const steps = { ArrowUp: 655, ArrowRight: 655, ArrowDown: -655, ArrowLeft: -655, PageUp: 6553, PageDown: -6553 }
    if (!(event.key in steps)) return
    event.preventDefault()
    knobTurn(steps[event.key], event.shiftKey)
  }
}

function render() {
  $('patch-name').value = patch.name ?? ''
  renderPages()
  renderGrid()
  showInspector()
  renderPerformance()
  renderValidation()
}

$('grid-wrap').onpointermove = event => {
  if (placement) showPlacementPreview(gridHit($('grid').getBoundingClientRect(), event.clientX, event.clientY))
}
$('grid-wrap').onpointerleave = () => showPlacementPreview(null)
$('grid-wrap').ondragleave = event => {
  if (!$('grid-wrap').contains(event.relatedTarget)) showPlacementPreview(null)
}
$('grid-wrap').ondragover = event => {
  if (!drag) return
  event.preventDefault()
  event.dataTransfer.dropEffect = drag.type ? 'copy' : 'move'
  if (drag.type) showPlacementPreview(gridHit($('grid').getBoundingClientRect(), event.clientX, event.clientY), drag.type)
}
$('grid-wrap').ondrop = event => {
  if (!drag) return
  event.preventDefault()
  const position = gridHit($('grid').getBoundingClientRect(), event.clientX, event.clientY)
  const moving = drag
  drag = null
  if (position === null) return
  if (moving.type) addAt(moving.type, position)
  else edit(() => {
    model.moveModule(moving.index, { page, position: position - moving.slot })
    selection = { kind: 'module', index: moving.index }
    placement = armed = null
  }, { regraph: false })
}

$('module-search').oninput = renderPalette
$('new').onclick = () => { patchLoad++; open(newPatch('Untitled').patch, 'New patch.', 0) }
$('patch-name').onchange = event => edit(() => model.renamePatch(event.target.value), { regraph: false })
$('add-page').onclick = () => edit(() => { page = model.addPage() }, { regraph: false })
$('rename-page').onclick = () => {
  const name = prompt('Page name (up to 16 ASCII characters)', patch.pages?.[page]?.name ?? '')
  if (name !== null) edit(() => {
    if (!model.pageCount) model.addPage(name)
    else model.renamePage(page, name)
  }, { regraph: false })
}
$('delete-page').onclick = () => {
  if (confirm(`Delete ${pageName(patch, page)} and its modules?`)) edit(() => {
    const changes = model.deletePage(page)
    selection = armed = null
    return changes
  })
}
$('undo').onclick = () => history('undo')
$('redo').onclick = () => history('redo')
$('save-bin').onclick = () => {
  try {
    if (!$('slot').reportValidity()) return
    const slot = String(Number($('slot').value)).padStart(3, '0')
    download(encodePatch(patch), `${slot}_zoia_${filename()}.bin`, 'application/octet-stream')
    status('Binary patch saved.')
  } catch (error) { status(error.message, 'error') }
}
$('save-text').onclick = () => {
  try {
    download(patchToYaml(patch), `${filename()}.txt`, 'text/plain')
    status('Text patch saved.')
  } catch (error) { status(error.message, 'error') }
}
$('print').onclick = () => window.print()
window.addEventListener('beforeprint', () => buildPrint(patch, pageIndices()))
window.addEventListener('afterprint', () => $('print-sheet').replaceChildren())

document.addEventListener('keydown', event => {
  if ($('corpus').open) return
  if (event.key === 'Escape' && (armed || placement)) {
    armed = placement = null
    renderGrid()
    return
  }
  if (event.target.closest?.('input,textarea,select,[contenteditable]')) return
  if (event.key === 'Delete') {
    event.preventDefault()
    removeSelection()
  } else if ((event.ctrlKey || event.metaKey) && ['z', 'y'].includes(event.key.toLowerCase())) {
    event.preventDefault()
    history(event.shiftKey || event.key.toLowerCase() === 'y' ? 'redo' : 'undo')
  }
})

async function readPatch(file, binary) {
  const request = ++patchLoad
  try {
    const data = await (binary ? file.arrayBuffer() : file.text())
    if (request !== patchLoad) return
    if (binary) openBin(data, file.name)
    else open(yamlToPatch(data), `Opened ${file.name}`)
  } catch (error) { if (request === patchLoad) status(error.message, 'error') }
}

function picker(buttonId, inputId, read) {
  $(buttonId).onclick = () => $(inputId).click()
  $(inputId).onchange = event => {
    const file = event.target.files[0]
    event.target.value = ''
    if (file) read(file)
  }
}
picker('open-bin', 'bin-file', file => readPatch(file, true))
picker('open-text', 'text-file', file => readPatch(file, false))
picker('open-audio', 'sound-file', loadAudioFile)
initCorpus((bytes, file) => { patchLoad++; openBin(bytes, file) })
window.addEventListener('dragover', event => {
  if (event.dataTransfer.types.includes('Files')) event.preventDefault()
})
window.addEventListener('drop', event => {
  const file = event.dataTransfer.files[0]
  if (!file) return
  event.preventDefault()
  if (/\.bin$/i.test(file.name)) readPatch(file, true)
  else if (/\.(txt|ya?ml)$/i.test(file.name)) readPatch(file, false)
  else loadAudioFile(file)
})

let activeSource = $('source').value
let activeFile = null
async function sourceChanged() {
  const version = ++audioFileLoad
  const source = $('source').value
  const file = audioFile
  try {
    await simulator.useSource(source, file)
    if (version !== audioFileLoad) return
    activeSource = source
    activeFile = file
  } catch (error) {
    if (version !== audioFileLoad) return
    $('source').value = activeSource
    audioFile = activeFile
    $('audio-file').textContent = audioFile?.name ?? ''
    status(error.message, 'error')
  }
}

function loadAudioFile(file) {
  audioFile = file
  $('source').value = 'file'
  $('audio-file').textContent = file.name
  sourceChanged()
  if (!playing) status(`Selected audio file ${file.name}`)
}

function setTransport(stopped) {
  $('play').disabled = !stopped
  $('leds').classList.toggle('engaged', !stopped)
  $('stop').disabled = stopped
  $('record').disabled = stopped || !playing
  $('record').textContent = 'Record 10 s to WAV'
}
function stop() {
  transport++
  audioFileLoad++
  simulator.stop()
  playing = false
  engineIssues = []
  buttonStates.clear()
  setTransport(true)
  simulator.meters({ peak: [0, 0] })
  renderPerformance()
  renderValidation()
}

$('play').onclick = async () => {
  const request = ++transport
  const source = $('source').value
  const file = audioFile
  setTransport(false)
  status(source === 'live' ? 'Waiting for live input…' : 'Starting simulator…')
  try {
    await simulator.start(() => patch, source, file, Number($('volume').value))
    if (request !== transport) return
    playing = true
    if ($('source').value === source && audioFile === file) {
      activeSource = source
      activeFile = file
    } else {
      await sourceChanged()
      if (request !== transport) return
    }
    simulator.setVolume(Number($('volume').value))
    buttonStates.forEach((state, module) => simulator.send('setState', { module, state }))
    setTransport(false)
    if ($('status').className !== 'error') status('Simulator running.')
  } catch (error) {
    if (request !== transport) return
    stop()
    status(error.message, 'error')
  }
}
$('stop').onclick = () => { stop(); status('Simulator stopped.') }
$('source').onchange = sourceChanged
$('volume').oninput = event => simulator.setVolume(Number(event.target.value))
$('record').onclick = () => {
  $('record').disabled = true
  $('record').textContent = 'Recording 10 s…'
  simulator.record()
}
window.addEventListener('pagehide', stop)

const systemTheme = matchMedia('(prefers-color-scheme: dark)')
function applyTheme() {
  const mode = $('theme').value
  document.documentElement.dataset.theme = mode === 'system' ? (systemTheme.matches ? 'dark' : 'light') : mode
}
$('theme').value = readStorage('zoia-editor.theme') ?? 'system'
$('theme').onchange = () => {
  writeStorage('zoia-editor.theme', $('theme').value)
  applyTheme()
}
systemTheme.addEventListener('change', applyTheme)
applyTheme()
initPedal()
renderPalette()
sync()

return {  };
})();
})();
</script>
</body>
